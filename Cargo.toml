# Generated by fabric2seer from a Fabric mod. See MODDING.md "Native mods".
#
# Build against the SDK build of the game (MODDING.md section 7):
#     cargo build --release
# then `py pack.py` (or copy target/release/skyblocker.dll + seer.mod.json into mods/skyblocker/).
[package]
name = "skyblocker"
version = "6.10.4"
edition = "2024"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
mcrust = { path = "C:/Users/y64/Desktop/McRust/RustSrc" }
# used by the translated classes (fabric2seer)
fancy-regex = "0.14"
indexmap = "2"
parking_lot = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
dandelion = { path = "C:/Users/y64/Desktop/McRust/mods-src/dandelion" }
# MoulConfig 4.7.2 (Java: shaded into Dandelion, Skyblocker's default config backend) - the library crate
moulconfig = { path = "C:/Users/y64/Desktop/McRust/mods-src/moulconfig" }
yacl = { path = "C:/Users/y64/Desktop/McRust/mods-src/yacl" }
# utils/ws/SkyblockerWebSocket (java.net.http.WebSocket): a blocking RFC 6455 client over rustls (ring provider,
# webpki roots) - batch W
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }

# Its own workspace root, so it never joins the game's package.
[workspace]
